name: Grafana Custom Image

on:
  push:
    branches: [ main ]
    paths:
      - 'grafana/**'

env:
  IMAGE_NAME: grafana-custom

jobs:
  publish:
    name: build and push grafana image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
    - name: checkout code
      uses: actions/checkout@v6

    - name: login to ghcr
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,prefix=
          type=raw,value=latest

    - name: build and push docker image
      uses: docker/build-push-action@v6
      with:
        context: ./grafana
        file: ./grafana/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: lowercase image name
      id: lower
      run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT

    - name: scan for vulnerabilities
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.lower.outputs.image }}
        format: table
        exit-code: '0'
        ignore-unfixed: true
        severity: CRITICAL,HIGH
