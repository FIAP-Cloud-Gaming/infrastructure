name: setup

on:
  workflow_dispatch:
    inputs:
      grafana_version:
        description: "Grafana image version (semver)"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read

concurrency:
  group: setup
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

jobs:
  terraform-state:
    name: create state storage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: terraform/setup

    steps:
      - name: azure login
        uses: azure/login@v2
        with:
          creds: |
            { 
              "clientId":"${{ env.ARM_CLIENT_ID }}",
              "clientSecret":"${{ env.ARM_CLIENT_SECRET }}",
              "subscriptionId":"${{ env.ARM_SUBSCRIPTION_ID }}",
              "tenantId":"${{ env.ARM_TENANT_ID }}"
            }

      - name: check if state storage exists
        id: check
        working-directory: .
        run: |
          EXISTS=$(az storage account check-name --name fcgtfstate --query "nameAvailable" -o tsv)
          if [ "$EXISTS" = "false" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Storage account already exists, skipping creation"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v6
        if: ${{ steps.check.outputs.skip != 'true' }}

      - uses: hashicorp/setup-terraform@v3
        if: ${{ steps.check.outputs.skip != 'true' }}

      - name: download current state
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: terraform-setup-state
          path: terraform/setup
        continue-on-error: true

      - name: terraform init
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: terraform init

      - name: terraform apply
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: terraform apply -auto-approve -input=false -var="subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}"

      - name: show outputs
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: terraform output

      - name: upload current state
        if: ${{ always() && steps.check.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: terraform-setup-state
          path: |
            terraform/setup/terraform.tfstate
            terraform/setup/terraform.tfstate.backup
          retention-days: 400
          overwrite: true

  grafana:
    name: build and push grafana image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    env:
      IMAGE_NAME: grafana-custom
      IMAGE_VERSION: ${{ inputs.grafana_version }}

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.IMAGE_VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.IMAGE_VERSION }}
            type=sha,prefix=
            type=raw,value=latest

      - name: build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: ./grafana
          file: ./grafana/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: lowercase image name
        id: lower
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_OUTPUT

      - name: scan for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.lower.outputs.image }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
