name: setup

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: setup
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  TF_WORKING_DIR: setup

jobs:
  setup:
    name: create state storage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3

      - name: download current state
        uses: actions/download-artifact@v7
        with:
          name: terraform-setup-state
          path: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true

      - name: terraform init
        run: terraform init

      - name: terraform apply
        run: terraform apply -auto-approve -input=false -var="subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}"

      - name: show outputs
        run: terraform output

      - name: upload current state
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: terraform-setup-state
          path: |
            ${{ env.TF_WORKING_DIR }}/terraform.tfstate
            ${{ env.TF_WORKING_DIR }}/terraform.tfstate.backup
          retention-days: 400
          overwrite: true
