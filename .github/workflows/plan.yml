name: plan

on:
  pull_request:
    paths:
      - "environments/**"
      - "modules/**"

permissions:
  contents: read
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

jobs:
  plan:
    name: terraform plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
        include:
          - environment: dev
            var_file: dev.tfvars
            extra_vars: ""
          - environment: prod
            var_file: prod.tfvars
            extra_vars: >-
              -var="postgres_password=${{ secrets.POSTGRES_PASSWORD }}"
              -var="jwt_secret=${{ secrets.JWT_SECRET }}"
              -var="rabbitmq_password=${{ secrets.RABBITMQ_PASSWORD }}"
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}

    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3

      - name: terraform init
        run: terraform init

      - name: terraform fmt check
        run: terraform fmt -check -recursive ../..

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        id: plan
        run: |
          terraform plan -no-color -input=false \
            -var-file="${{ matrix.var_file }}" \
            -var="subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" \
            -var="ghcr_token=${{ secrets.GHCR_TOKEN }}" \
            ${{ matrix.extra_vars }}
        continue-on-error: true

      - name: comment plan on pr
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### Terraform Plan — \`${{ matrix.environment }}\`
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            **Result:** \`${{ steps.plan.outcome }}\`
            *Triggered by @${{ github.actor }} on \`${{ github.event.pull_request.head.ref }}\`*`;

            const body = output.length > 65000
              ? output.substring(0, 65000) + '\n\n... truncated'
              : output;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
