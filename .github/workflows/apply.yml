name: apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      action:
        description: "Terraform action"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read

concurrency:
  group: terraform-apply-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  TF_WORKING_DIR: environments/${{ github.event.inputs.environment }}

jobs:
  apply:
    name: terraform ${{ github.event.inputs.action }} (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3

      - name: terraform init
        run: terraform init

      - name: terraform apply (dev)
        if: github.event.inputs.action != 'destroy' && github.event.inputs.environment == 'dev'
        run: |
          terraform apply -auto-approve -input=false \
            -var-file="dev.tfvars" \
            -var="subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" \
            -var="ghcr_token=${{ secrets.GHCR_TOKEN }}"

      - name: terraform apply (prod)
        if: github.event.inputs.action != 'destroy' && github.event.inputs.environment == 'prod'
        run: |
          terraform apply -auto-approve -input=false \
            -var-file="prod.tfvars" \
            -var="subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" \
            -var="ghcr_token=${{ secrets.GHCR_TOKEN }}" \
            -var="postgres_password=${{ secrets.POSTGRES_PASSWORD }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="rabbitmq_password=${{ secrets.RABBITMQ_PASSWORD }}"

      - name: terraform destroy (dev)
        if: github.event.inputs.action == 'destroy' && github.event.inputs.environment == 'dev'
        run: |
          terraform destroy -auto-approve -input=false \
            -var-file="dev.tfvars" \
            -var="subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" \
            -var="ghcr_token=${{ secrets.GHCR_TOKEN }}"

      - name: terraform destroy (prod)
        if: github.event.inputs.action == 'destroy' && github.event.inputs.environment == 'prod'
        run: |
          terraform destroy -auto-approve -input=false \
            -var-file="prod.tfvars" \
            -var="subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" \
            -var="ghcr_token=${{ secrets.GHCR_TOKEN }}" \
            -var="postgres_password=${{ secrets.POSTGRES_PASSWORD }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET }}" \
            -var="rabbitmq_password=${{ secrets.RABBITMQ_PASSWORD }}"
