name: deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - aca
          - vm
          - aks
      action:
        description: "Terraform action"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

jobs:
  terraform:
    name: terraform ${{ inputs.action }} (${{ inputs.target }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/${{ inputs.target }}

    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init

      - name: terraform ${{ inputs.action }}
        run: |
          terraform ${{ inputs.action }} -auto-approve -input=false \
            -var-file="dev.tfvars" \
            -var="subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" \
            -var="ghcr_token=${{ secrets.GHCR_TOKEN }}"

  apply-k8s:
    name: apply kubernetes manifests
    needs: terraform
    if: ${{ inputs.target == 'aks' && inputs.action == 'apply' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: azure login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.ARM_CLIENT_ID }}","clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}","subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.ARM_TENANT_ID }}"}'

      - name: get aks credentials
        run: az aks get-credentials --resource-group rg-fcg-dev --name fcg-aks --overwrite-existing

      - name: install nginx ingress controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.0/deploy/static/provider/cloud/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=120s

      - name: create ghcr secret
        run: |
          kubectl create namespace fcg --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-secret \
            --namespace=fcg \
            --docker-server=ghcr.io \
            --docker-username=fiap-cloud-gaming \
            --docker-password=${{ secrets.GHCR_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: apply kustomize manifests
        run: kubectl apply -k k8s/overlays/dev/

      - name: wait for deployments
        run: |
          kubectl rollout status deployment/postgres -n fcg --timeout=120s
          kubectl rollout status deployment/rabbitmq -n fcg --timeout=120s
          kubectl rollout status deployment/identity-api -n fcg --timeout=180s
          kubectl rollout status deployment/catalog-api -n fcg --timeout=180s
          kubectl rollout status deployment/payment-api -n fcg --timeout=180s
          kubectl rollout status deployment/gateway-api -n fcg --timeout=180s

      - name: show ingress ip
        run: |
          echo "Waiting for Ingress external IP..."
          kubectl get ingress fcg-ingress -n fcg
          kubectl get svc -n ingress-nginx ingress-nginx-controller
