apiVersion: 1

datasources:
  # Loki - Application Logs
  - name: Loki
    type: loki
    access: proxy
    url: $LOKI_URL
    isDefault: true
    editable: true
    jsonData:
      maxLines: 1000

  # Jaeger - Distributed Tracing
  - name: Jaeger
    type: jaeger
    access: proxy
    url: $JAEGER_URL
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
        filterBySpanID: false
