apiVersion: apps/v1
kind: Deployment
metadata:
  name: azurite
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: azurite
  template:
    metadata:
      labels:
        app: azurite
    spec:
      containers:
        - name: azurite
          image: mcr.microsoft.com/azure-storage/azurite
          ports:
            - containerPort: 10000
              name: blob
            - containerPort: 10001
              name: queue
            - containerPort: 10002
              name: table
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: azurite
  namespace: fcg
spec:
  selector:
    app: azurite
  ports:
    - port: 10000
      targetPort: 10000
      name: blob
    - port: 10001
      targetPort: 10001
      name: queue
    - port: 10002
      targetPort: 10002
      name: table
