apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: fcg
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: grafana
          image: ghcr.io/fiap-cloud-gaming/grafana-custom:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: "%(protocol)s://%(domain)s/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: LOKI_URL
              value: "http://loki:3100"
            - name: JAEGER_URL
              value: "http://jaeger:16686"
          readinessProbe:
            httpGet:
              path: /grafana/api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: fcg
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
