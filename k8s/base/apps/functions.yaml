apiVersion: apps/v1
kind: Deployment
metadata:
  name: functions
  namespace: fcg
  labels:
    app: functions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: functions
  template:
    metadata:
      labels:
        app: functions
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: functions
          image: ghcr.io/fiap-cloud-gaming/functions:1.0.0
          ports:
            - containerPort: 80
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: RABBITMQ_PASSWORD
            - name: AzureWebJobsStorage
              value: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1"
            - name: FUNCTIONS_WORKER_RUNTIME
              value: "dotnet-isolated"
            - name: RabbitMQConnection
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: functions
  namespace: fcg
spec:
  selector:
    app: functions
  ports:
    - port: 80
      targetPort: 80
